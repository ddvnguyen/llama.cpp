name: Hydra Build & Push

# NOTE: GitHub Actions workflow_dispatch has no native multi-select/checkbox
# input type. Each boolean input below renders as its own checkbox in the
# "Run workflow" form — that's the standard way to get checkbox-style
# multi-select. The resolve job below turns whichever boxes are checked
# into a list of (arch, binary) combinations to build.
on:
  workflow_dispatch:
    inputs:
      build_llama_engine:
        description: "Build llama-engine (adds Hydra RPC / COMBINED-mode support over llama-server)"
        type: boolean
        default: true
      build_llama_server:
        description: "Build llama-server"
        type: boolean
        default: false
      arch_sm86_sm120:
        description: "Target sm86-sm120 (RTX 3060 + 5060 Ti, CUDA 13.2)"
        type: boolean
        default: true
      arch_sm60:
        description: "Target sm60 (Tesla P100, CUDA 12.9)"
        type: boolean
        default: false
      runner_target:
        description: "Where to run the build"
        type: choice
        options:
          - local
          - cloud
        default: local
      execution_mode:
        description: "How to run multiple selected combinations"
        type: choice
        options:
          - matrix
          - sequential
        default: matrix
  workflow_call:
    inputs:
      build_llama_engine:
        type: boolean
        default: true
      build_llama_server:
        type: boolean
        default: false
      arch_sm86_sm120:
        type: boolean
        default: true
      arch_sm60:
        type: boolean
        default: false
      runner_target:
        type: string
        default: local
      execution_mode:
        type: string
        default: matrix
    outputs:
      rtx-image:
        description: "OCI image ref pushed for RTX (sm86-sm120)"
        value: ${{ jobs.build-matrix.outputs.rtx-image || jobs.build-sequential.outputs.rtx-image }}
      p100-image:
        description: "OCI image ref pushed for P100 (sm60)"
        value: ${{ jobs.build-matrix.outputs.p100-image || jobs.build-sequential.outputs.p100-image }}
    secrets:
      GITHUB_TOKEN:
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/ddvnguyen/llama-server

jobs:
  # ── Resolve checked boxes into a list of (arch, binary) combos ──────────
  resolve:
    name: Resolve build combinations
    runs-on: ubuntu-latest
    outputs:
      combos: ${{ steps.resolve.outputs.combos }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve selected combinations
        id: resolve
        run: |
          combos=()

          if [ "${{ inputs.arch_sm86_sm120 }}" = "true" ]; then
            if [ "${{ inputs.build_llama_engine }}" = "true" ]; then
              combos+=('{"arch":"sm86-sm120","binary":"llama-engine","cuda_version":"13.2","cuda_arch":"86;120"}')
            fi
            if [ "${{ inputs.build_llama_server }}" = "true" ]; then
              combos+=('{"arch":"sm86-sm120","binary":"llama-server","cuda_version":"13.2","cuda_arch":"86;120"}')
            fi
          fi

          if [ "${{ inputs.arch_sm60 }}" = "true" ]; then
            if [ "${{ inputs.build_llama_engine }}" = "true" ]; then
              combos+=('{"arch":"sm60","binary":"llama-engine","cuda_version":"12.9","cuda_arch":"60"}')
            fi
            if [ "${{ inputs.build_llama_server }}" = "true" ]; then
              combos+=('{"arch":"sm60","binary":"llama-server","cuda_version":"12.9","cuda_arch":"60"}')
            fi
          fi

          if [ ${#combos[@]} -eq 0 ]; then
            echo "::error::No build selected — check at least one architecture and at least one binary."
            exit 1
          fi

          COMBOS_JSON=$(printf '%s\n' "${combos[@]}" | jq -s -c '.')
          echo "combos=$COMBOS_JSON" >> "$GITHUB_OUTPUT"
          echo "Selected combinations: $COMBOS_JSON"

          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

  # ── Parallel: one job per selected combination ──────────────────────────
  build-matrix:
    name: Build ${{ matrix.arch }} / ${{ matrix.binary }} - ${{ inputs.runner_target }}
    needs: resolve
    if: inputs.execution_mode == 'matrix'
    runs-on: ${{ inputs.runner_target == 'cloud' && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: ${{ inputs.runner_target == 'cloud' && 45 || 30 }}
    outputs:
      rtx-image: ${{ steps.set-outputs.outputs.rtx-image }}
      p100-image: ${{ steps.set-outputs.outputs.p100-image }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.combos) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Provision toolchain (local)
        if: inputs.runner_target == 'local'
        run: |
          CUDA_PATH="/opt/software/cuda/${{ matrix.cuda_version }}"
          if [ ! -x "$CUDA_PATH/bin/nvcc" ]; then
            echo "ERROR: CUDA toolkit not found at $CUDA_PATH"
            exit 1
          fi
          echo "CUDA_PATH=$CUDA_PATH" >> "$GITHUB_ENV"

          # No sudo on this host — ccache lives under $HOME and persists
          # across runs since this is a persistent self-hosted runner.
          CCACHE_VERSION="4.10.2"
          CCACHE_BIN="$HOME/.local/bin/ccache"
          if [ ! -x "$CCACHE_BIN" ]; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/ccache-${CCACHE_VERSION}-linux-x86_64.tar.xz" -o /tmp/ccache.tar.xz
            tar -xJf /tmp/ccache.tar.xz -C /tmp
            cp "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64/ccache" "$CCACHE_BIN"
            rm -rf /tmp/ccache.tar.xz "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64"
          fi
          mkdir -p "$HOME/.cache/hydra-ccache"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.cache/hydra-ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=10G" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros,locale" >> "$GITHUB_ENV"

      - name: Provision toolchain (cloud)
        if: inputs.runner_target == 'cloud'
        run: |
          CUDA_VERSION="${{ matrix.cuda_version }}"
          CUDA_MAJOR=$(echo "$CUDA_VERSION" | cut -d. -f1)
          CUDA_MINOR=$(echo "$CUDA_VERSION" | cut -d. -f2)

          curl -fSsL https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb -o cuda-keyring.deb
          sudo dpkg -i cuda-keyring.deb
          rm cuda-keyring.deb

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-toolkit-${CUDA_MAJOR}-${CUDA_MINOR} \
            cmake ninja-build build-essential g++-14 libssl-dev libgomp1 ccache

          echo "CUDA_PATH=/usr/local/cuda-${CUDA_VERSION}" >> "$GITHUB_ENV"

      - name: Cache ccache (cloud)
        if: inputs.runner_target == 'cloud'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.arch }}-${{ matrix.binary }}-${{ needs.resolve.outputs.sha }}
          restore-keys: |
            ccache-${{ matrix.arch }}-${{ matrix.binary }}-

      - name: Configure ccache (cloud)
        if: inputs.runner_target == 'cloud'
        run: |
          mkdir -p ~/.ccache
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros,locale" >> "$GITHUB_ENV"

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build, package, push
        run: |
          bash .github/workflows/scripts/build-combo.sh \
            "${{ matrix.arch }}" "${{ matrix.binary }}" "${{ matrix.cuda_version }}" "${{ matrix.cuda_arch }}" \
            "$CUDA_PATH" "${{ env.IMAGE_REPO }}" "${{ needs.resolve.outputs.sha }}" "${{ inputs.runner_target }}"

      - name: Set outputs
        id: set-outputs
        run: |
          IMAGE_TAG="${{ matrix.arch }}-${{ matrix.binary }}-${{ needs.resolve.outputs.sha }}"
          IMAGE="${{ env.IMAGE_REPO }}:${IMAGE_TAG}"
          if [[ "${{ matrix.arch }}" == sm86-sm120 ]]; then
            echo "rtx-image=$IMAGE" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${{ matrix.arch }}" == sm60 ]]; then
            echo "p100-image=$IMAGE" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy reminder
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF

          ### Deploy

          Update the \`source:\` field in the node config, then run \`bash scripts/deploy-hydra-head.sh <node>\`:
          - \`infra/hydra-head/config/node-rtx.yaml\`
          - \`infra/hydra-head/config/node-p100.yaml\`
          EOF

  # ── Sequential: one job, loops over every selected combination ─────────
  build-sequential:
    name: Build (sequential)
    needs: resolve
    if: inputs.execution_mode == 'sequential'
    runs-on: ${{ inputs.runner_target == 'cloud' && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: ${{ inputs.runner_target == 'cloud' && 90 || 60 }}
    outputs:
      rtx-image: ${{ steps.set-outputs.outputs.rtx-image }}
      p100-image: ${{ steps.set-outputs.outputs.p100-image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Provision toolchain (local)
        if: inputs.runner_target == 'local'
        run: |
          for CUDA_VERSION in $(echo '${{ needs.resolve.outputs.combos }}' | jq -r '.[].cuda_version' | sort -u); do
            CUDA_PATH="/opt/software/cuda/${CUDA_VERSION}"
            if [ ! -x "$CUDA_PATH/bin/nvcc" ]; then
              echo "ERROR: CUDA toolkit not found at $CUDA_PATH"
              exit 1
            fi
          done

          CCACHE_VERSION="4.10.2"
          CCACHE_BIN="$HOME/.local/bin/ccache"
          if [ ! -x "$CCACHE_BIN" ]; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/ccache-${CCACHE_VERSION}-linux-x86_64.tar.xz" -o /tmp/ccache.tar.xz
            tar -xJf /tmp/ccache.tar.xz -C /tmp
            cp "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64/ccache" "$CCACHE_BIN"
            rm -rf /tmp/ccache.tar.xz "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64"
          fi
          mkdir -p "$HOME/.cache/hydra-ccache"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.cache/hydra-ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=10G" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros,locale" >> "$GITHUB_ENV"

      - name: Provision toolchain (cloud)
        if: inputs.runner_target == 'cloud'
        run: |
          curl -fSsL https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb -o cuda-keyring.deb
          sudo dpkg -i cuda-keyring.deb
          rm cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build build-essential g++-14 libssl-dev libgomp1 ccache

          for CUDA_VERSION in $(echo '${{ needs.resolve.outputs.combos }}' | jq -r '.[].cuda_version' | sort -u); do
            CUDA_MAJOR=$(echo "$CUDA_VERSION" | cut -d. -f1)
            CUDA_MINOR=$(echo "$CUDA_VERSION" | cut -d. -f2)
            sudo apt-get install -y --no-install-recommends cuda-toolkit-${CUDA_MAJOR}-${CUDA_MINOR}
          done

      - name: Cache ccache (cloud)
        if: inputs.runner_target == 'cloud'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-sequential-${{ needs.resolve.outputs.sha }}
          restore-keys: |
            ccache-sequential-

      - name: Configure ccache (cloud)
        if: inputs.runner_target == 'cloud'
        run: |
          mkdir -p ~/.ccache
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros,locale" >> "$GITHUB_ENV"

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build each selected combination
        run: |
          echo '${{ needs.resolve.outputs.combos }}' | jq -c '.[]' | while read -r combo; do
            ARCH=$(echo "$combo" | jq -r '.arch')
            BINARY=$(echo "$combo" | jq -r '.binary')
            CUDA_VERSION=$(echo "$combo" | jq -r '.cuda_version')
            CUDA_ARCH=$(echo "$combo" | jq -r '.cuda_arch')

            if [ "${{ inputs.runner_target }}" = "cloud" ]; then
              CUDA_PATH="/usr/local/cuda-${CUDA_VERSION}"
            else
              CUDA_PATH="/opt/software/cuda/${CUDA_VERSION}"
            fi

            bash .github/workflows/scripts/build-combo.sh \
              "$ARCH" "$BINARY" "$CUDA_VERSION" "$CUDA_ARCH" "$CUDA_PATH" \
              "${{ env.IMAGE_REPO }}" "${{ needs.resolve.outputs.sha }}" "${{ inputs.runner_target }}"
          done

      - name: Set outputs
        id: set-outputs
        run: |
          RTX_IMAGE=""
          P100_IMAGE=""
          for combo in $(echo '${{ needs.resolve.outputs.combos }}' | jq -c '.[]'); do
            ARCH=$(echo "$combo" | jq -r '.arch')
            BINARY=$(echo "$combo" | jq -r '.binary')
            IMAGE_TAG="${ARCH}-${BINARY}-${{ needs.resolve.outputs.sha }}"
            IMAGE="${{ env.IMAGE_REPO }}:${IMAGE_TAG}"
            if [[ "$ARCH" == sm86-sm120 ]]; then
              RTX_IMAGE="$IMAGE"
            fi
            if [[ "$ARCH" == sm60 ]]; then
              P100_IMAGE="$IMAGE"
            fi
          done
          [ -n "$RTX_IMAGE" ] && echo "rtx-image=$RTX_IMAGE" >> "$GITHUB_OUTPUT"
          [ -n "$P100_IMAGE" ] && echo "p100-image=$P100_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy reminder
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF

          ### Deploy

          Update the \`source:\` field in the node config, then run \`bash scripts/deploy-hydra-head.sh <node>\`:
          - \`infra/hydra-head/config/node-rtx.yaml\`
          - \`infra/hydra-head/config/node-p100.yaml\`
          EOF
